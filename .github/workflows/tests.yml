name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'literature/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/tests.yml'
  # No paths filter on pull_request: these checks are ruleset-required, and a
  # path-filtered required check never reports on out-of-scope PRs, blocking merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  call-tests:
    uses: django-mvp/shared/.github/workflows/tests.yml@v0.4.0
    permissions:
      contents: read
    with:
      coverage-package: literature
      django-versions: '["5.2", "6.0"]'
      # Test/lint tooling lives in the single (non-optional) dev group via the
      # mvp-shared[dev,test] bundle, so the default `--with test` would fail.
      # `--extras ui` installs the opt-in front end's dependency (django-mvp)
      # too — without it, every literature.ui test is silently skipped here
      # and the suite shrinks to the core (plan.md risk 3). The matrix's
      # default python-versions (3.12, 3.13) already satisfy the extra's
      # python_version >= 3.12 marker.
      poetry-install-args: '--extras ui'
    secrets: inherit
