# One group per ecosystem matching "*", so a cycle's updates arrive as a single pull
# request — this is what makes auto-merge-dependabot.yml viable.
# `reviewers:` is deliberately absent: GitHub replaced it with code owners.
version: 2
updates:
  # Python dependencies (uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # mvp-shared is a git dependency pinned to a tag, and the same tag is
    # pinned again in every workflow that calls django-mvp/shared. The two have
    # to move together, which a Dependabot bump to pyproject.toml and uv.lock
    # alone cannot do, so the tag is bumped by hand when a shared release lands.
    ignore:
      - dependency-name: "mvp-shared"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
