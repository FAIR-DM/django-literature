{% comment %}
  The <datalist> of stored contributor names (FS-012): accepting a suggestion only writes text
  into the input, referencing no record. Its own template, out of the row markup, because the
  formset's __prefix__ cloning would otherwise rewrite it.
{% endcomment %}
<datalist id="{{ id }}">
  {% for name in names %}<option value="{{ name }}"></option>{% endfor %}
</datalist>
