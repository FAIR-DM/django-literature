{% load i18n %}
{% comment %}
  The row's edit control (FS-009). ``show_update_action`` follows the same ``CRUDDirectoryMixin``
  flag ``ItemDetailView``'s own edit action reads, so this feature introduces no check of its own.
{% endcomment %}
{% if show_update_action %}
  <c-button href="{% url 'literature:item-update' pk=record.pk %}"
            text="{% translate 'Edit' %}"
            icon="edit"
            size="sm"
            variant="primary" />
{% endif %}
