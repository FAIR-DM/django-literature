[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["literature"]

[tool.hatch.build.targets.sdist]
include = ["/literature", "/README.md", "/LICENSE"]

[dependency-groups]
# Toolchain bundle; the tag in [tool.uv.sources] below is the shared toolchain
# version. The python marker keeps the package's 3.11 floor for consumers, since
# mvp-shared needs 3.12 and dev tooling never ships to them.
#
# The front end's dependencies sit here too, so the default sync installs the
# opt-in `ui` extra: without them every literature.ui test is silently skipped
# and the suite shrinks to the core. They repeat the floors declared in the `ui`
# extra of [project.optional-dependencies].
dev = [
    "mvp-shared[dev,test] ; python_version >= '3.12'",
    "django-literature[ui] ; python_version >= '3.12'",
]
# Same marker as above: docs tooling needs 3.12 but never ships to consumers, so
# it must not drag the package's own 3.11 floor up with it.
docs = [
    "fairdm-docs[sphinx_book_theme] ; python_version >= '3.12'",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }
fairdm-docs = { git = "https://github.com/FAIR-DM/fairdm-docs" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py", "*_tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=literature",
    "--cov-report=html",
    "-ra",
]
filterwarnings = [
    "ignore",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["literature"]

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, hardcoded test passwords, blind-exception asserts, nested-with
# and unused variables — style rules that don't pay for themselves in tests.
"tests/*" = ["S101", "S105", "B017", "F841", "SIM117"]
# The bundled demo project ships a throwaway dev SECRET_KEY by design.
"demo/settings.py" = ["S105"]

[tool.mypy]
files = ["literature"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "literature/"
plugins = ["mypy_django_plugin.main"]
# django-stubs emits django-manager-missing on reverse relation accessors
# (e.g. Item.item_names) that resolve fine at runtime — a known false positive.
disable_error_code = ["django-manager-missing"]

[tool.django-stubs]
# The core-only settings, deliberately not tests.settings. The plugin calls
# django.setup(), so it needs every app in INSTALLED_APPS importable — and
# tests.settings installs literature.ui, whose dependency arrives through an
# optional extra the Code Quality job does not install. Pointing here costs
# nothing: literature.ui declares no models, and ignore_missing_imports above
# already resolves django-mvp to Any (it ships no py.typed).
django_settings_module = "tests.settings_core"
ignore_missing_model_attributes = "True"

[tool.deptry]
extend_exclude = ["tasks.py", "tests/", "demo/", "docs/"]

# django-mvp installs as `mvp`, and deptry only learns that by reading the
# installed package's metadata. The Code Quality job installs the main and dev
# groups but no extra, so there deptry falls back to guessing `django_mvp` and
# reports literature/ui/views.py's `from mvp.views import ...` as undeclared.
# Stating the mapping makes the check answer the same either way.
#
# django-filter has the same problem in the other direction: uninstalled,
# deptry's guess replaces "-" with "_" and gets `django_filter` (singular) —
# the real module `literature/ui/filters.py` imports is `django_filters`
# (plural). Confirmed against deptry.dependency.Dependency directly (T001):
# without this entry it warns and assumes the wrong name.
[tool.deptry.package_module_name_map]
django-mvp = "mvp"
django-filter = "django_filters"

[tool.deptry.per_rule_ignores]
DEP003 = ["literature"]

[project]
name = "django-literature"
description = "A scientific literature management tool for Django"
license = "MIT"
version = "0.1.9"
readme = "README.md"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
requires-python = '>=3.11,<4.0'
keywords = ["django", "literature", "publications", "scientific", "research"]
dependencies = [
    'django>=4.2',
    'django-partial-date',
    "bibtexparser>=1.4.4,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# django-mvp declares requires-python >=3.12, so the marker keeps `uv lock`
# resolvable on the package's 3.11 floor by making the extra unavailable there
# rather than raising it. django-tables2 and django-filter are named directly
# because django-mvp reaches them as guarded optional integrations (#88).
ui = [
    "django-mvp (>=0.19.3,<1.0) ; python_version >= '3.12'",
    "django-tables2 (>=3.0,<4) ; python_version >= '3.12'",
    "django-filter (>=26.1,<27) ; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/FAIR-DM/django-literature"
Repository = "https://github.com/FAIR-DM/django-literature"

[tool.forge.conformance]
# tests/test_ui/test_templates.py tests the shipped templates under
# literature/ui/templates/ directly — its subject is not a Python module, so
# there is no literature/ui/templates.py to mirror (Article X's declared
# exception). Each entry is declared with the commit that creates its file, so
# the conformance gate stays green between stories; T025 (Phase 5) checks the
# final list rather than assembling it. test_architecture.py takes the package
# boundary as its subject, test_packaging.py takes pyproject.toml, and
# test_boot.py takes the core booting with the UI app absent — none of the four
# mirrors a Python module.
# tests/test_demo/ is declared once, as a directory prefix: its subject is the
# demo project, which lives outside the literature/ source tree the mirror
# rule is defined against (plan.md D-9).
non-mirror-paths = [
    "tests/test_ui/test_architecture.py",
    "tests/test_ui/test_boot.py",
    "tests/test_ui/test_packaging.py",
    "tests/test_ui/test_templates.py",
    "tests/test_demo/",
    # Subject is docstring presence across the whole package, not one module.
    "tests/test_documentation.py",
]
